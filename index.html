<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Happy Birthday 🎂</title>

  <!-- Quan trọng: giúp web vừa khít màn hình điện thoại -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      background: #000;
      font-family: Arial, sans-serif;
    }

    .card-frame {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .qr-box {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #fff7fb;
      text-align: center;
      padding: 20px;
    }
  </style>
</head>
<body>

<div id="content">Đang tải...</div>

<script>
  const mySite = window.location.origin + window.location.pathname;

  // 🔴 DÁN LINK EMBED CANVA Ở ĐÂY
  const canvaEmbed = "https://www.canva.com/design/DAG_xBSZNjU/QkSuotcsofmLYjWQNwnhwA/watch?embed";

  const urlParams = new URLSearchParams(window.location.search);
  const opened = urlParams.get("open");
  const contentDiv = document.getElementById("content");

  if (opened === "1") {
    // 👉 Hiện thiệp toàn màn hình, tự chạy
    contentDiv.innerHTML = `
      <div class="card-frame">
        <iframe 
          src="${canvaEmbed}&autoplay=1&loop=1"
          allow="autoplay"
          allowfullscreen>
        </iframe>
      </div>
    `;
  } else {
    // 👉 Hiện QR
    const qrLink = mySite + "?open=1";
    const qrAPI = "https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=" + encodeURIComponent(qrLink);

    contentDiv.innerHTML = `
      <div class="qr-box">
        <h2>📱 Quét mã QR này</h2>
        <p>Mở ra sẽ có bất ngờ 🎁</p>
        <img src="${qrAPI}" alt="QR Code">
      </div>
    `;
  }
</script>

</body>
</html>
