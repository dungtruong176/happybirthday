<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Happy Birthday 🎂</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #fff7fb;
      text-align: center;
      padding-top: 40px;
    }
    .box {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
    }
    iframe {
      width: 100%;
      height: 600px;
      border: none;
      border-radius: 12px;
    }
  </style>
</head>
<body>

<div class="box" id="content">
  Đang tải...
</div>

<script>
  // Link website của bạn (sau khi upload)
  const mySite = window.location.origin + window.location.pathname;

  // Link thiệp Canva (nhấn Share → Embed → copy link)
  const canvaEmbed = "<div style="position: relative; width: 100%; height: 0; padding-top: 56.2500%;
 padding-bottom: 0; box-shadow: 0 2px 8px 0 rgba(63,69,81,0.16); margin-top: 1.6em; margin-bottom: 0.9em; overflow: hidden;
 border-radius: 8px; will-change: transform;">
  <iframe loading="lazy" style="position: absolute; width: 100%; height: 100%; top: 0; left: 0; border: none; padding: 0;margin: 0;"
    src="https://www.canva.com/design/DAG_xBSZNjU/QkSuotcsofmLYjWQNwnhwA/watch?embed" allowfullscreen="allowfullscreen" allow="fullscreen">
  </iframe>
</div>
<a href="https:&#x2F;&#x2F;www.canva.com&#x2F;design&#x2F;DAG_xBSZNjU&#x2F;QkSuotcsofmLYjWQNwnhwA&#x2F;watch?utm_content=DAG_xBSZNjU&amp;utm_campaign=designshare&amp;utm_medium=embeds&amp;utm_source=link" target="_blank" rel="noopener">Gold Modern Birthday Greeting Twitter Post Video</a> của Việt Trinh Nguyễn Thị";

  // Kiểm tra nếu đã quét QR
  const urlParams = new URLSearchParams(window.location.search);
  const opened = urlParams.get("open");

  const contentDiv = document.getElementById("content");

  if(opened === "1") {
    // Hiện thiệp
    contentDiv.innerHTML = `
      <h2>🎉 Happy Birthday 🎉</h2>
      <p>Chúc bạn một ngày sinh nhật thật vui vẻ!</p>
      <iframe src="${canvaEmbed}"></iframe>
    `;
  } else {
    // Hiện QR để quét
    const qrLink = mySite + "?open=1";
    const qrAPI = "https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=" + encodeURIComponent(qrLink);

    contentDiv.innerHTML = `
      <h2>📱 Quét mã QR này</h2>
      <p>Sau khi quét, điều bất ngờ sẽ xuất hiện ✨</p>
      <img src="${qrAPI}" alt="QR Code">
    `;
  }
</script>

</body>
</html>
